<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valuation range chart</title>
<!-- SA - Valuation Charts Addendum to Master Dashboard. v0.4, 11-Sep-2026 (session 4: median middle band D-VAL-42; peer lines off until shown D-VAL-41).
     Self-contained: no external library. Reads valuation/_index.js, valuation/<TICKER>.js,
     valuation/groups/<key>.js and (daily price) charts/<TICKER>.js by script injection. -->
<style>
:root{
  --bg:#f7f5ef;--card:#fbfaf5;--card-hover:#f0ede3;--border:#e8e3d4;
  --text:#333333;--text-dim:#6b6b6b;--text-bright:#1a1a1a;
  --green:#2e7d32;--green-dim:#e8f5e9;--red:#c62828;--red-dim:#ffebee;
  --amber:#8d6e00;--amber-dim:#fff8e1;--blue:#1565c0;--purple:#7955bf;
  --font:'Aptos','Segoe UI',system-ui,-apple-system,sans-serif
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.4}
.wrap{max-width:1500px;margin:0 auto;padding:14px 18px 30px}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;margin:0;color:var(--text-bright);font-weight:700}
h1 small{font-weight:500;color:var(--text-dim);font-size:14px;margin-left:8px}
.meta{color:var(--text-dim);font-size:12px;margin-top:3px}
.meta b{color:var(--text);font-weight:600}
.current{font-size:22px;font-weight:700;color:var(--text-bright);text-align:right}
.current small{display:block;font-size:11px;font-weight:500;color:var(--text-dim)}
.search{display:flex;gap:6px;align-items:center}
.search input{font-family:var(--font);font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text);width:300px}
.search a{font-size:12px;color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.group .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-right:4px}
.btn{background:rgba(27,61,92,0.04);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font);font-size:11px;font-weight:500;padding:4px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--card-hover);color:var(--text-bright)}
.btn.on{background:#1b3d5c;color:#fff;font-weight:700;border-color:#1b3d5c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:11px;background:#fff}
.chip i{display:inline-block;width:10px;height:10px;border-radius:2px}
.chip button{border:0;background:none;cursor:pointer;color:var(--text-dim);font-size:12px;padding:0}
.chip.off{opacity:.5}
.chip.off i{background:#bbb!important}
.peerin{font-family:var(--font);font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;width:230px;background:#fff}
#chartbox{position:relative}
canvas{display:block;width:100%;height:520px}
#tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:11.5px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;min-width:160px;z-index:5}
#tip .d{font-weight:700;color:var(--text-bright);margin-bottom:3px}
#tip .r{display:flex;justify-content:space-between;gap:12px}
#tip .r i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:11.5px;color:var(--text-dim)}
.legend span i{display:inline-block;width:18px;height:0;border-top:3px solid #333;vertical-align:middle;margin-right:5px}
.legend span i.dash{border-top-style:dashed}
.legend span i.dot{border-top-style:dotted}
.legend span i.zone{width:12px;height:12px;border:0;border-radius:2px}
.note{font-size:12px;color:var(--amber);margin-top:6px}
.err{font-size:13px;color:var(--red);padding:20px 0}
.foot{font-size:11px;color:var(--text-dim);margin-top:8px}
@media (max-width:700px){canvas{height:380px}.search input{width:200px}.current{text-align:left}}
/* MD-VAL-PANEL-EMBED-2026-09-16 (Watson, SA - Master Dashboard). ?embed=1 puts the page inside the
   dashboard's right-hand slide-in panel, where the panel supplies the stock name, the close button and
   the full-screen link. Trim the chrome this page would otherwise duplicate and give the canvas a height
   that suits a narrow column. Nothing here changes the standalone page. */
body.embed .wrap{max-width:none;padding:8px 12px 18px}
body.embed header{margin-bottom:8px;gap:6px 14px;align-items:center}
body.embed h1{font-size:15px}
body.embed h1 small{font-size:12px;margin-left:6px}
body.embed .meta{font-size:11px}
body.embed #back{display:none}
/* MD-VAL-PANEL-QC1-2026-09-16 F3: the panel header already names the stock, so the page's own h1
   would print it a second time three lines below. Keep the meta lines, which the panel does not carry. */
body.embed h1{display:none}
/* F4: the switch-stock box is a fixed 300px, which overflows a quarter-width panel. Let it flex. */
body.embed .search{flex:1 1 220px;min-width:0}
body.embed .search input{width:100%;min-width:0}
body.embed .current{font-size:17px}
body.embed .card{padding:8px 10px;margin-bottom:8px}
body.embed canvas{height:430px}
@media (max-width:700px){body.embed canvas{height:340px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="name">Valuation range chart <small id="tk"></small></h1>
      <div class="meta" id="meta1"></div>
      <div class="meta" id="meta2"></div>
    </div>
    <div class="search">
      <input id="q" list="stocks" placeholder="Switch stock: ticker or name" autocomplete="off">
      <datalist id="stocks"></datalist>
      <a id="back" href="index.html">Master Dashboard</a>
    </div>
    <div class="current" id="cur"></div>
  </header>

  <div class="card">
    <div class="controls" id="controls">
      <div class="group"><span class="lbl">Window</span>
        <button class="btn" data-k="win" data-v="2">2Y</button><button class="btn" data-k="win" data-v="5">5Y</button><button class="btn" data-k="win" data-v="10">10Y</button></div>
      <div class="group"><span class="lbl">Multiple</span>
        <button class="btn" data-k="field" data-v="pe">24M fwd P/E</button><button class="btn" data-k="field" data-v="evs" id="evsbtn">24M fwd EV/Sales</button></div>
      <div class="group"><span class="lbl">Price</span>
        <button class="btn" data-k="px" data-v="off">Off</button><button class="btn" data-k="px" data-v="monthly">Monthly</button><button class="btn" data-k="px" data-v="daily" id="dailybtn">Daily</button></div>
      <div class="group"><span class="lbl">Cohort</span>
        <button class="btn" data-k="cohAvg" data-v="toggle">Average</button><button class="btn" data-k="cohLines" data-v="toggle">Each stock</button></div>
      <div class="group"><span class="lbl">Sector</span>
        <button class="btn" data-k="secAvg" data-v="toggle">Average</button><button class="btn" data-k="secLines" data-v="toggle">Each stock</button></div>
      <div class="group"><span class="lbl">Industry</span>
        <button class="btn" data-k="indAvg" data-v="toggle">Average</button></div>
      <div class="group"><span class="lbl">Group average</span>
        <button class="btn" data-k="avg" data-v="mean">Mean</button><button class="btn" data-k="avg" data-v="median">Median</button></div>
      <div class="group"><span class="lbl">Named peers (up to 5)</span>
        <button class="btn" data-k="peerLines" data-v="toggle" id="peerbtn" title="Draw the named peers' lines on the chart">Show lines</button>
        <span id="chips"></span>
        <input id="peerq" class="peerin" list="stocks" placeholder="add ticker or name" autocomplete="off"></div>
    </div>
  </div>

  <div class="card">
    <div id="chartbox"><canvas id="c"></canvas><div id="tip"></div></div>
    <div class="legend" id="legend"></div>
    <div class="note" id="note"></div>
    <div class="err" id="err" style="display:none"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
var VAL_REGISTRY = VAL_REGISTRY || {};
var VAL_GROUPS = VAL_GROUPS || {};
var CHART_REGISTRY = CHART_REGISTRY || {};
</script>
<script>
(function(){
  'use strict';
  // MD-VAL-PANEL-EMBED-2026-09-16: set before anything paints, so the panel never shows the full-page
  // header for a frame and then collapse it.
  var EMBED = /[?&]embed=1(&|$)/.test(location.search);
  if (EMBED && document.body) document.body.className = (document.body.className ? document.body.className + ' ' : '') + 'embed';
  // ── constants ────────────────────────────────────────────────────────────────────────
  var MIDDLE = 'p50';                  // the middle band level: the MEDIAN (D-VAL-42, closes Q-VAL-17); the mean is a dashed reference line
  var MEAN_COLOUR = '#9a8a2e';
  var ZONES = [                         // bottom -> top
    {c:'#5fbf6f', a:0.55}, {c:'#a8dba0', a:0.55}, {c:'#d9efc4', a:0.60},
    {c:'#fbf1b8', a:0.70}, {c:'#f7cf9a', a:0.65}, {c:'#f2a4a4', a:0.60}];
  var LEVEL_COLOURS = ['#6fbf73','#7fbf6f','#c9c25a','#e0a45c','#e06f6f'];
  var PEER_COLOURS = ['#1565c0','#7955bf','#8d6e00','#2e7d32','#c62828'];
  var GROUP_STYLE = {coh:{c:'#1565c0',label:'Cohort'}, sec:{c:'#7955bf',label:'Sector'}, ind:{c:'#8d6e00',label:'Industry'}};
  var LINE_COLOUR = '#e0dccd';        // individual peer lines (recessive; hover isolates)
  var MAX_PEERS = 5, MAX_LINES = 60;

  // ── state ────────────────────────────────────────────────────────────────────────────
  var S = {t:null, win:5, field:'pe', px:'monthly', cohAvg:false, cohLines:false, secAvg:false, secLines:false,
           indAvg:false, avg:'mean', peers:[], peerLines:false, hoverIdx:-1, hoverKey:null};
  var IDX = null, REC = null, loading = {}, geom = null, series = [];
  var $ = function(id){ return document.getElementById(id); };
  var canvas = $('c'), ctx = canvas.getContext('2d');

  // ── loading by script injection (same mechanism as the dashboard's chart files) ──────
  function inject(src, cb){
    if (loading[src] === 'done'){ cb(true); return; }
    if (loading[src]){ loading[src].push(cb); return; }
    loading[src] = [cb];
    var s = document.createElement('script');
    s.src = src + (src.indexOf('?')<0 ? '?v=' + (IDX && IDX.generated ? encodeURIComponent(IDX.generated) : Date.now()) : '');
    s.onload = function(){ var cbs = loading[src]; loading[src] = 'done'; cbs.forEach(function(f){ f(true); }); };
    s.onerror = function(){ var cbs = loading[src]; delete loading[src]; cbs.forEach(function(f){ f(false); }); };
    document.head.appendChild(s);
  }
  function loadStock(t, cb){ if (VAL_REGISTRY[t]) return cb(true); inject('valuation/' + encodeURIComponent(t) + '.js', function(ok){ cb(ok && !!VAL_REGISTRY[t]); }); }
  function loadGroup(key, cb){ if (VAL_GROUPS[key]) return cb(true); inject('valuation/groups/' + encodeURIComponent(key) + '.js', function(ok){ cb(ok && !!VAL_GROUPS[key]); }); }
  function loadDaily(t, cb){ if (CHART_REGISTRY[t]) return cb(true); inject('charts/' + encodeURIComponent(t) + '.js', function(ok){ cb(ok && !!CHART_REGISTRY[t]); }); }

  // ── helpers ──────────────────────────────────────────────────────────────────────────
  function fmtX(v, f){ if (v == null) return '–'; return (f === 'evs' || v < 10 ? v.toFixed(2) : v.toFixed(1)) + 'x'; }
  function fmtPx(v){ if (v == null) return '–'; return v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2); }
  function monthLabel(ym){ var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return M[+ym.slice(5,7)-1] + '-' + ym.slice(2,4); }
  function groupKey(kind, code){ var b = {coh:'cohorts', sec:'sectors', ind:'industries'}[kind]; var e = IDX && IDX[b] && IDX[b][code]; return e ? e.key : null; }
  function members(kind){ var k = groupKey(kind, REC[kind]); var g = k && VAL_GROUPS[k]; return g ? g.members.filter(function(m){ return m !== S.t; }) : []; }

  // ── data assembly: which series are drawn for the current state ──────────────────────
  function buildSeries(){
    series = [];
    if (!REC) return;
    var f = S.field, months = REC.months, n = months.length, start = Math.max(0, n - S.win * 12);
    var slice = function(arr){ return arr ? arr.slice(start) : []; };
    var win = months.slice(start);
    // subject
    series.push({key:'subject', label:REC.name + ' ' + (f==='pe'?'24M fwd P/E':'24M fwd EV/Sales'), colour:'#333', width:2.6, axis:'mult', vals:slice(REC[f]), kind:'subject'});
    // group averages
    ['coh','sec','ind'].forEach(function(kind){
      var on = {coh:S.cohAvg, sec:S.secAvg, ind:S.indAvg}[kind];
      if (!on) return;
      var k = groupKey(kind, REC[kind]); var g = k && VAL_GROUPS[k]; if (!g) return;
      var v = g[f + '_' + S.avg]; var cnt = g[f + '_n'];
      // align by month: group months may differ from the stock's window (same generation, same months, but be safe)
      var map = {}; g.months.forEach(function(m,i){ map[m] = i; });
      var vals = win.map(function(m){ var i = map[m]; return i == null ? null : v[i]; });
      var cn = win.map(function(m){ var i = map[m]; return i == null ? 0 : cnt[i]; });
      var last = 0; for (var q = cn.length - 1; q >= 0; q--){ if (cn[q] > 0){ last = cn[q]; break; } }
      series.push({key:'avg_'+kind, label:GROUP_STYLE[kind].label + ' ' + S.avg + ' (' + g.members.length + ' with data' + (last<2?', too few':'') + ')', colour:GROUP_STYLE[kind].c, width:1.8, dash:[6,4], axis:'mult', vals:vals, counts:cn, kind:'avg', weak:last<2});
    });
    // individual lines
    ['coh','sec'].forEach(function(kind){
      var on = kind==='coh' ? S.cohLines : S.secLines; if (!on) return;
      members(kind).slice(0, MAX_LINES).forEach(function(m){
        var r = VAL_REGISTRY[m]; if (!r) return;
        var map = {}; r.months.forEach(function(mm,i){ map[mm] = i; });
        series.push({key:'line_'+m, label:(r.name||m), colour:LINE_COLOUR, width:1, axis:'mult', vals:win.map(function(mm){ var i = map[mm]; return i == null ? null : r[f][i]; }), kind:'line', ticker:m});
      });
    });
    // named peers: chips always show; lines only when S.peerLines (D-VAL-41)
    if (S.peerLines) S.peers.forEach(function(m, i){
      var r = VAL_REGISTRY[m]; if (!r) return;
      var map = {}; r.months.forEach(function(mm,j){ map[mm] = j; });
      series.push({key:'peer_'+m, label:(r.name||m) + ' (' + m + ')', colour:PEER_COLOURS[i % PEER_COLOURS.length], width:1.6, axis:'mult', vals:win.map(function(mm){ var j = map[mm]; return j == null ? null : r[f][j]; }), kind:'peer', ticker:m});
    });
    // price
    if (S.px === 'monthly') series.push({key:'px', label:'Share price, month-end (left axis)', colour:'#555', width:1.2, dash:[1.5,2.5], axis:'px', vals:slice(REC.px), kind:'px'});
    if (S.px === 'daily' && CHART_REGISTRY[S.t]){
      var first = win[0] + '-01', rows = CHART_REGISTRY[S.t].filter(function(r){ return r[0] >= first; });
      series.push({key:'pxd', label:'Share price, daily (left axis)', colour:'#555', width:1.1, axis:'px', daily:rows.map(function(r){ return [r[0], r[4]]; }), kind:'pxd'});
    }
    series.win = win;
  }

  // ── drawing ──────────────────────────────────────────────────────────────────────────
  function draw(){
    var box = $('chartbox'), W = box.clientWidth, H = canvas.clientHeight || 520, dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    if (!REC){ return; }
    var win = series.win, n = win.length, f = S.field;
    var padL = 56, padR = 62, padT = 14, padB = 34, pw = W - padL - padR, ph = H - padT - padB;
    var x = function(i){ return padL + (n <= 1 ? pw/2 : i * pw / (n - 1)); };
    var dateX = function(iso){ // daily price: fractional month position
      var ym = iso.slice(0,7), i = win.indexOf(ym); if (i < 0) return null;
      var d = +iso.slice(8,10), dim = new Date(+iso.slice(0,4), +iso.slice(5,7), 0).getDate();
      return padL + ((i - 1) + d / dim) * pw / (n - 1);   // month i spans (i-1 .. i]: month-end sits at i
    };
    // multiple axis range: subject + peers + averages + bands
    var vmin = Infinity, vmax = -Infinity, smax = -Infinity;
    var bands = REC.bands && REC.bands[f];
    var levels = bands ? [bands.p10, bands.p35, bands[MIDDLE], bands.p75, bands.p90] : null;
    series.forEach(function(s){ if (s.axis !== 'mult' || s.kind !== 'subject') return; s.vals.forEach(function(v){ if (v != null){ if (v < vmin) vmin = v; if (v > vmax) vmax = v; } }); });
    if (levels){ levels.concat(bands.mean != null ? [bands.mean] : []).forEach(function(v){ if (v < vmin) vmin = v; if (v > vmax) vmax = v; }); }
    if (!isFinite(vmin)){ vmin = 0; vmax = 1; }
    smax = vmax;                                   // the subject's own scale
    var cap = Math.max(smax * 2.5, smax + 5);      // averages and named peers may stretch the axis this far; individual lines never do
    S.clipped = [];
    series.forEach(function(s){ if (s.axis !== 'mult' || (s.kind !== 'avg' && s.kind !== 'peer')) return; var m = -Infinity; s.vals.forEach(function(v){ if (v != null){ if (v < vmin) vmin = v; if (v > m) m = v; } }); if (m > vmax) vmax = Math.min(m, cap); if (m > cap) S.clipped.push(s.label.replace(/ \(.*$/, '')); });
    var lo = Math.max(0, vmin - (vmax - vmin) * 0.12), hi = vmax + (vmax - vmin) * 0.12; if (hi <= lo) hi = lo + 1;
    var y = function(v){ return padT + ph - (v - lo) / (hi - lo) * ph; };
    // price axis range
    var pmax = 0; series.forEach(function(s){ if (s.axis !== 'px') return; (s.vals || s.daily.map(function(r){ return r[1]; })).forEach(function(v){ if (v != null && v > pmax) pmax = v; }); });
    var yp = function(v){ return padT + ph - v / (pmax * 1.12 || 1) * ph; };
    // zones
    ctx.save(); ctx.beginPath(); ctx.rect(padL, padT, pw, ph); ctx.clip();
    if (levels){
      var sorted = levels.slice().sort(function(a,b){ return a-b; });
      var edges = [lo].concat(sorted, [hi]);
      for (var z = 0; z < 6; z++){ ctx.globalAlpha = ZONES[z].a; ctx.fillStyle = ZONES[z].c; ctx.fillRect(padL, y(edges[z+1]), pw, y(edges[z]) - y(edges[z+1])); }
      ctx.globalAlpha = 1;
      levels.forEach(function(v, i){ ctx.strokeStyle = LEVEL_COLOURS[i]; ctx.lineWidth = 1.2; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(padL+pw, y(v)); ctx.stroke(); });
      if (bands.mean != null){ ctx.strokeStyle = MEAN_COLOUR; ctx.lineWidth = 1.2; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(padL, y(bands.mean)); ctx.lineTo(padL+pw, y(bands.mean)); ctx.stroke(); }
      ctx.setLineDash([]);
    } else { ctx.fillStyle = '#fbfaf5'; ctx.fillRect(padL, padT, pw, ph); }
    // year grid
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
    win.forEach(function(m, i){ if (m.slice(5) === '01' || (S.win === 2 && (m.slice(5) === '07'))){ ctx.beginPath(); ctx.moveTo(x(i), padT); ctx.lineTo(x(i), padT+ph); ctx.stroke(); } });
    // series: lines first (recessive), then averages, peers, subject on top
    var order = {line:0, peer:1, avg:2, px:3, pxd:3, subject:4};
    series.slice().sort(function(a,b){ return order[a.kind] - order[b.kind]; }).forEach(function(s){
      var isolated = S.hoverKey && S.hoverKey === s.key;
      var dimmed = S.hoverKey && !isolated && s.kind === 'line';
      ctx.strokeStyle = isolated && s.kind === 'line' ? '#1565c0' : s.colour; ctx.lineWidth = isolated ? s.width + 1.2 : s.width;
      ctx.globalAlpha = dimmed ? 0.35 : (s.weak ? 0.45 : 1);
      ctx.setLineDash(s.dash || []); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); var pen = false;
      if (s.daily){
        s.daily.forEach(function(r){ var px = dateX(r[0]); if (px == null || r[1] == null){ pen = false; return; } var py = yp(r[1]); if (pen) ctx.lineTo(px, py); else ctx.moveTo(px, py); pen = true; });
      } else {
        s.vals.forEach(function(v, i){ if (v == null){ pen = false; return; } var py = s.axis === 'px' ? yp(v) : y(v); if (pen) ctx.lineTo(x(i), py); else ctx.moveTo(x(i), py); pen = true; });
      }
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    });
    ctx.restore();
    // axes
    ctx.strokeStyle = '#e8e3d4'; ctx.lineWidth = 1; ctx.strokeRect(padL, padT, pw, ph);
    ctx.fillStyle = '#6b6b6b'; ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var ticks = niceTicks(lo, hi, 6);
    ticks.forEach(function(v){ ctx.fillText((v >= 10 ? v.toFixed(0) : f === 'evs' ? v.toFixed(2) : v.toFixed(1)) + 'x', padL + pw + 6, y(v)); ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(padL+pw, y(v)); ctx.stroke(); });
    if (pmax > 0){ ctx.textAlign = 'right'; niceTicks(0, pmax*1.12, 5).forEach(function(v){ ctx.fillText(v === 0 ? '0' : v >= 10 ? v.toFixed(0) : fmtPx(v), padL - 6, yp(v)); }); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    var every = S.win === 2 ? 3 : S.win === 5 ? 6 : 12; while (pw / (n / every) < 54 && every < 48) every *= 2;
    win.forEach(function(m, i){ var mm = +m.slice(5,7); if ((mm - 1) % every === 0) ctx.fillText(monthLabel(m), x(i), padT + ph + 6); });
    // hover
    if (S.hoverIdx >= 0 && S.hoverIdx < n){
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x(S.hoverIdx), padT); ctx.lineTo(x(S.hoverIdx), padT+ph); ctx.stroke(); ctx.setLineDash([]);
      series.forEach(function(s){ if (s.daily) return; var v = s.vals[S.hoverIdx]; if (v == null) return; ctx.fillStyle = s.colour === LINE_COLOUR ? '#999' : s.colour; ctx.beginPath(); ctx.arc(x(S.hoverIdx), s.axis === 'px' ? yp(v) : y(v), 3.5, 0, Math.PI*2); ctx.fill(); });
    }
    geom = {padL:padL, padR:padR, padT:padT, padB:padB, pw:pw, ph:ph, n:n, x:x, y:y, yp:yp, lo:lo, hi:hi};
  }
  function niceTicks(lo, hi, count){
    var span = hi - lo, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
    var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag, out = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }

  // ── legend, header, notes ────────────────────────────────────────────────────────────
  function renderText(){
    var f = S.field, bands = REC.bands && REC.bands[f];
    $('name').innerHTML = REC.name + ' <small>' + REC.t + '</small>';
    $('meta1').innerHTML = '<b>' + REC.ind + '</b> · ' + REC.sec + ' · cohort ' + REC.coh + (REC.coh_name ? ' (' + REC.coh_name + ')' : '');
    var stale = REC.stale && REC.stale[f];
    $('meta2').innerHTML = 'FactSet data to <b>' + (REC.data_to || '–') + '</b> · ' + REC.n[f] + ' monthly points' +
      (stale ? ' · <span style="color:var(--amber)">' + (f==='pe'?'P/E':'EV/Sales') + ' held from the last good parse (' + stale + ')</span>' : '') +
      ' · generated ' + REC.generated;
    var cur = REC.current && REC.current[f];
    var dash = (f === 'pe' && REC.dash_pe && REC.dash_pe.pe != null && cur && Math.abs(REC.dash_pe.pe - cur) / cur > 0.03) ? ' · dashboard shows ' + fmtX(REC.dash_pe.pe, f) + ' (Yahoo price / FactSet EPS)' : '';
    $('cur').innerHTML = (cur ? fmtX(cur, f) : '–') + '<small>FactSet current ' + (f==='pe'?'24M fwd P/E':'24M fwd EV/Sales') + (REC.latest_px && REC.latest_px.close ? ' · price ' + fmtPx(REC.latest_px.close) + ' (' + REC.latest_px.date + ')' : '') + dash + '</small>';
    var L = [];
    series.forEach(function(s){ if (s.kind === 'line') return; L.push('<span><i style="border-top-color:' + s.colour + '" class="' + (s.dash ? (s.dash[0] < 3 ? 'dot' : 'dash') : '') + '"></i>' + s.label + '</span>'); });
    var nl = series.filter(function(s){ return s.kind === 'line'; }).length;
    if (nl) L.push('<span><i style="border-top-color:#c9c4b4"></i>' + nl + ' individual ' + (S.cohLines && S.secLines ? 'cohort and sector' : S.cohLines ? 'cohort' : 'sector') + ' stocks (hover to name one)</span>');
    if (bands){
      var names = ['10th pct','35th pct', MIDDLE === 'mean' ? 'mean' : 'median','75th pct','90th pct'];
      [bands.p10, bands.p35, bands[MIDDLE], bands.p75, bands.p90].forEach(function(v,i){ L.push('<span><i style="border-top-color:' + LEVEL_COLOURS[i] + '"></i>' + names[i] + ' ' + fmtX(v, f) + '</span>'); });
      if (bands.mean != null) L.push('<span><i class="dash" style="border-top-color:' + MEAN_COLOUR + '"></i>mean ' + fmtX(bands.mean, f) + ' (dashed)</span>');
      L.push('<span>bands: ten-year history, ' + bands.n + ' points, fixed across windows</span>');
    }
    $('legend').innerHTML = L.join('');
    var notes = [];
    if (!bands) notes.push('No bands: fewer than 24 months of history (' + REC.n[f] + ' points).');
    if (bands && bands.mean > bands.p75) notes.push('The mean (dashed) sits above the 75th percentile: the history is skewed by a re-rating, which is why the median is the middle band.');
    if (S.peers.length && !S.peerLines) notes.push('Named peers listed but not drawn: click "Show lines" to add them.');
    if (f === 'evs' && REC.n.evs === 0) notes.push('No EV/Sales data for this stock.');
    if (REC.n.px && REC.px_source && !REC.px_source.backfill && S.px !== 'off'){ var first = null; for (var i = 0; i < REC.px.length; i++){ if (REC.px[i] != null){ first = REC.months[i]; break; } } if (first && first > REC.months[Math.max(0, REC.months.length - S.win * 12)]) notes.push('Price shown from ' + first + ' (earlier months arrive with the ten-year price backfill).'); }
    if (S.clipped && S.clipped.length) notes.push('Off the scale: ' + S.clipped.join(', ') + ' (peaks above 2.5 times this stock\'s own range are cut off).');
    series.forEach(function(s){ if (s.kind === 'avg' && s.weak) notes.push(s.label.replace(/ \(.*$/, '') + ': fewer than 2 members with data this month, average greyed.'); });
    $('note').textContent = notes.join(' ');
    $('foot').textContent = 'Source: FactSet (FE_VALUATION, 24-month forward, monthly month-end) via the Viewforth valuation workbook; share price from the dashboard price cache. Multiples outside 0 to ' + (f==='pe'?'200':'100') + 'x are treated as missing. Peer averages use members with data that month.';
  }

  // ── controls ─────────────────────────────────────────────────────────────────────────
  function syncButtons(){
    Array.prototype.forEach.call(document.querySelectorAll('.btn[data-k]'), function(b){
      var k = b.getAttribute('data-k'), v = b.getAttribute('data-v');
      var on = v === 'toggle' ? !!S[k] : String(S[k]) === v; b.classList.toggle('on', on);
    });
    $('evsbtn').disabled = !!(REC && REC.n.evs === 0);
    $('dailybtn').disabled = S.win === 10;
    var chips = S.peers.map(function(p, i){ var r = VAL_REGISTRY[p]; return '<span class="chip' + (S.peerLines ? '' : ' off') + '"><i style="background:' + PEER_COLOURS[i % PEER_COLOURS.length] + '"></i>' + p + (r ? ' ' + r.name : '') + '<button data-rm="' + p + '" title="remove">×</button></span>'; });
    $('chips').innerHTML = chips.join('');
    $('peerbtn').disabled = !S.peers.length; $('peerbtn').textContent = S.peerLines ? 'Lines shown' : 'Show lines';
  }
  function update(){
    // load whatever the state needs, then draw
    var need = [];
    if (S.cohAvg || S.cohLines){ var k1 = groupKey('coh', REC.coh); if (k1) need.push(['group', k1]); }
    if (S.secAvg || S.secLines){ var k2 = groupKey('sec', REC.sec); if (k2) need.push(['group', k2]); }
    if (S.indAvg){ var k3 = groupKey('ind', REC.ind); if (k3) need.push(['group', k3]); }
    S.peers.forEach(function(p){ need.push(['stock', p]); });
    if (S.px === 'daily') need.push(['daily', S.t]);
    var pending = need.length;
    var after = function(){
      // individual lines need the members' files: a second wave
      var m2 = [];
      if (S.cohLines) members('coh').slice(0, MAX_LINES).forEach(function(m){ m2.push(m); });
      if (S.secLines) members('sec').slice(0, MAX_LINES).forEach(function(m){ m2.push(m); });
      var p2 = m2.length;
      if (!p2) return finish();
      m2.forEach(function(m){ loadStock(m, function(){ if (--p2 === 0) finish(); }); });
    };
    var finish = function(){ buildSeries(); syncButtons(); draw(); renderText(); };
    if (!pending) return after();
    need.forEach(function(item){
      var cb = function(){ if (--pending === 0) after(); };
      if (item[0] === 'group') loadGroup(item[1], cb); else if (item[0] === 'stock') loadStock(item[1], cb); else loadDaily(item[1], cb);
    });
  }
  $('controls').addEventListener('click', function(e){
    var b = e.target.closest('.btn'); if (!b || b.disabled) return;
    var k = b.getAttribute('data-k'), v = b.getAttribute('data-v');
    if (v === 'toggle') S[k] = !S[k]; else S[k] = (k === 'win') ? +v : v;
    if (S.win === 10 && S.px === 'daily') S.px = 'monthly';
    update();
  });
  $('chips').addEventListener('click', function(e){ var b = e.target.closest('button[data-rm]'); if (!b) return; S.peers = S.peers.filter(function(p){ return p !== b.getAttribute('data-rm'); }); update(); });
  function resolveTicker(text){
    if (!IDX) return null; var q = (text || '').trim(); if (!q) return null;
    var up = q.toUpperCase().split(' ')[0];
    if (IDX.stocks[up]) return up;
    var hit = null; Object.keys(IDX.stocks).forEach(function(t){ if (!hit && (t === up || IDX.stocks[t].name.toLowerCase() === q.toLowerCase())) hit = t; });
    if (!hit) Object.keys(IDX.stocks).forEach(function(t){ if (!hit && IDX.stocks[t].name.toLowerCase().indexOf(q.toLowerCase()) === 0) hit = t; });
    return hit;
  }
  $('peerq').addEventListener('change', function(){ var t = resolveTicker(this.value); this.value = ''; if (!t || t === S.t || S.peers.indexOf(t) >= 0) return; if (S.peers.length >= MAX_PEERS){ var inp = this, ph = inp.placeholder; inp.placeholder = 'Up to 5 named peers: remove one first'; setTimeout(function(){ inp.placeholder = ph; }, 3000); return; } S.peers.push(t); S.peerLines = true; update(); });
  $('q').addEventListener('change', function(){ var t = resolveTicker(this.value); if (t){ this.value = ''; show(t); } });

  // ── hover ────────────────────────────────────────────────────────────────────────────
  canvas.addEventListener('mousemove', function(e){
    if (!geom || !REC) return;
    var r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    if (mx < geom.padL || mx > geom.padL + geom.pw){ hideTip(); return; }
    var i = Math.round((mx - geom.padL) / geom.pw * (geom.n - 1)); i = Math.max(0, Math.min(geom.n - 1, i));
    // nearest line for isolation
    var best = null, bd = 12;
    series.forEach(function(s){ if (s.kind !== 'line' && s.kind !== 'peer') return; var v = s.vals[i]; if (v == null) return; var d = Math.abs(geom.y(v) - my); if (d < bd){ bd = d; best = s.key; } });
    S.hoverIdx = i; S.hoverKey = best; draw();
    var rows = [], f = S.field;
    series.forEach(function(s){ if (s.daily) return; if (s.kind === 'line' && s.key !== best) return; var v = s.vals[i]; if (v == null && s.kind === 'line') return;
      rows.push('<div class="r"><span><i style="background:' + (s.kind==='line' ? '#1565c0' : s.colour) + '"></i>' + (s.kind === 'line' ? s.label + ' (' + s.ticker + ')' : s.label.replace(/ \(.*$/, '')) + '</span><b>' + (s.axis === 'px' ? fmtPx(v) : fmtX(v, f)) + (s.counts ? ' <span style="color:#6b6b6b;font-weight:400">n=' + s.counts[i] + '</span>' : '') + '</b></div>'); });
    var tip = $('tip'); tip.innerHTML = '<div class="d">' + monthLabel(series.win[i]) + ' (' + series.win[i] + ')</div>' + rows.join('');
    tip.style.display = 'block';
    var tw = tip.offsetWidth, left = mx + 14; if (left + tw > r.width - 4) left = mx - tw - 14;
    tip.style.left = left + 'px'; tip.style.top = Math.max(4, Math.min(my - 10, r.height - tip.offsetHeight - 4)) + 'px';
  });
  function hideTip(){ $('tip').style.display = 'none'; if (S.hoverIdx >= 0 || S.hoverKey){ S.hoverIdx = -1; S.hoverKey = null; draw(); } }
  canvas.addEventListener('mouseleave', hideTip);
  window.addEventListener('resize', function(){ if (REC) draw(); });

  // ── stock switching and boot ─────────────────────────────────────────────────────────
  function show(t){
    S.t = t; $('err').style.display = 'none';
    if (history.replaceState) history.replaceState(null, '', '?t=' + encodeURIComponent(t) + (EMBED ? '&embed=1' : ''));  /* MD-VAL-PANEL-EMBED-2026-09-16: keep embed mode across an in-page stock switch */
    document.title = t + ' valuation range';
    loadStock(t, function(ok){
      if (!ok){ REC = null; series = []; draw();
        var known = IDX && IDX.stocks[t]; var nodata = IDX && IDX.no_data && IDX.no_data.indexOf(t) >= 0;
        $('name').innerHTML = (known ? known.name : t) + ' <small>' + t + '</small>'; $('meta1').textContent = ''; $('meta2').textContent = ''; $('cur').textContent = ''; $('legend').innerHTML = ''; $('note').textContent = '';
        $('err').style.display = 'block';
        $('err').textContent = nodata ? 'No valuation data yet for ' + t + ': FactSet returned nothing for this identifier, or the stock has no row in the valuation workbook. It is picked up automatically once the identifier resolves (next FactSet refresh is Sunday).' : 'No valuation file for ' + t + '. Check the ticker (Viewforth form, e.g. ART-ES).';
        return; }
      REC = VAL_REGISTRY[t];
      if (REC.n.evs === 0 && S.field === 'evs') S.field = 'pe';
      // pre-load the position manager's curated peers for holdings (once per stock)
      if (REC.pms_peers && !S.peersSeeded){ S.peersSeeded = t; S.peerLines = false; var list = (REC.pms_peers.sector || []).concat(REC.pms_peers.cohort || []); S.peers = []; list.forEach(function(p){ if (S.peers.length < MAX_PEERS && p !== t && IDX && IDX.stocks[p] && S.peers.indexOf(p) < 0) S.peers.push(p); }); }
      else if (S.peersSeeded && S.peersSeeded !== t){ S.peersSeeded = null; S.peers = S.peers.filter(function(p){ return p !== t; }); if (REC.pms_peers){ S.peersSeeded = t; S.peerLines = false; var l2 = (REC.pms_peers.sector || []).concat(REC.pms_peers.cohort || []); S.peers = []; l2.forEach(function(p){ if (S.peers.length < MAX_PEERS && p !== t && IDX && IDX.stocks[p] && S.peers.indexOf(p) < 0) S.peers.push(p); }); } }
      update();
    });
  }
  function boot(){
    inject('valuation/_index.js', function(ok){
      if (!ok || typeof VAL_INDEX === 'undefined'){ $('err').style.display = 'block'; $('err').textContent = 'valuation/_index.js not loaded: the valuation data has not been published yet.'; return; }
      IDX = VAL_INDEX;
      var dl = $('stocks'), frag = document.createDocumentFragment();
      Object.keys(IDX.stocks).sort().forEach(function(t){ var o = document.createElement('option'); o.value = t; o.label = IDX.stocks[t].name; frag.appendChild(o); });
      dl.appendChild(frag);
      var m = /[?&]t=([^&#]+)/.exec(location.search), t = m ? decodeURIComponent(m[1]).toUpperCase() : (location.hash ? location.hash.slice(1).toUpperCase() : null);
      show(t || 'ART-ES');
    });
  }
  boot();
})();
</script>
