:root{--ink:#1a1a1a;--txt:#333;--dim:#6b6b6b;--faint:#a39f90;--line:#e8e3d4;--line2:#d5cfbd;--bg:#f7f5ef;--card:#fbfaf5;--head:#f0ede3;--band:#f3efe2;
 --green:#2e7d32;--dgreen:#1b5e20;--red:#c62828;--amber:#8d6e00;--blue:#1565c0;--gbg:#e2efe0;--abg:#fdf1d0;--rbg:#fbe3e1}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:12px/1.35 'Aptos','Segoe UI',system-ui,-apple-system,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:8px 8px 8px;min-height:0}
#app.hcp{height:auto;display:block}
.hd{display:flex;align-items:baseline;gap:14px;flex:none;margin:0 0 7px;min-width:0}
.hd h1{font-size:16px;font-weight:700;color:var(--ink);margin:0;white-space:nowrap}
.hd .sum{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.hd a.how{color:var(--blue);cursor:pointer;font-size:11.5px;white-space:nowrap}.hd a.how:hover{text-decoration:underline}
.hd .meta{color:var(--dim);font-size:11px;white-space:nowrap}

.about li{margin:0 0 3px}
h2{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 6px}
.tiles{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 8px}
.tile{background:var(--card);border:1px solid var(--line);border-bottom:3px solid #cfc9b6;border-radius:4px;padding:5px 10px 6px;cursor:pointer;user-select:none;min-width:0}
.tile:hover{background:#f1eee3}
.tile .th{display:flex;align-items:baseline;gap:8px;min-width:0}
.tile .tn{font-size:21px;font-weight:700;color:var(--ink);line-height:1.2}
.tile .tl{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .tx{font-size:11px;color:var(--dim);line-height:1.3;margin-top:1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile.t1{border-bottom-color:#e0b63a}.tile.t2{border-bottom-color:#de8a2c}.tile.t3{border-bottom-color:#2e7d32}.tile.tcf{border-bottom-color:#1565c0}
.tile.on{background:#e7f0e4;border-color:#1b5e20;box-shadow:inset 0 0 0 1px #1b5e20}
.bar{flex:none;display:flex;align-items:center;gap:14px;margin:0 0 6px;color:var(--dim);min-width:0;white-space:nowrap}
.bar b{color:var(--ink)}.bar .sp{flex:1}
.bar input.q{font:inherit;padding:3px 7px;border:1px solid var(--line2);border-radius:3px;background:#fff;width:190px}
.bar a{color:var(--blue);cursor:pointer;text-decoration:none}.bar a:hover{text-decoration:underline}
.bar .hint{color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rt{position:relative;display:inline-block}
.tw{flex:1;min-height:140px;overflow:auto;scrollbar-gutter:stable;border:1px solid var(--line2);background:var(--card);border-radius:3px}

table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}
th,td{padding:0 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td{height:34px;font-size:12px}
tbody tr:hover td{box-shadow:inset 0 1px 0 #c9c2ab,inset 0 -1px 0 #c9c2ab}
thead th{position:sticky;z-index:3;background:var(--head);color:var(--dim);font-weight:600;font-size:10.5px;line-height:1.18}
thead tr.grp th{top:0;height:22px;background:var(--band);font-weight:700;letter-spacing:.2px;border-top:2px solid transparent}

.ar{color:var(--blue);font-size:9px}

.tri{font-size:8px;vertical-align:1px}
.fb:hover{border-color:#8a8676;color:var(--ink)}.fb.act{background:var(--dgreen);border-color:var(--dgreen);color:#fff}
.rt .fb{font-size:12px;line-height:20px;padding:0 8px;margin:0;color:var(--txt)}
th.gs,td.gs{border-left:2px solid var(--line2)}
thead tr.grp th.c1{color:#8d6e00;border-top-color:#c9a227}thead tr.grp th.c2{color:#2e7d32;border-top-color:#2e7d32}thead tr.grp th.c3{color:#1565c0;border-top-color:#1565c0}
thead tr.grp th.c4{color:#7955bf;border-top-color:#7955bf}thead tr.grp th.c5{color:#00695c;border-top-color:#00695c}thead tr.grp th.c6{color:#5d4037;border-top-color:#8d6e63}
thead tr.grp th.c7{color:#ad5a00;border-top-color:#de8a2c}thead tr.grp th.c8{color:#00838f;border-top-color:#00838f}thead tr.grp th.c9{color:#6a1b9a;border-top-color:#8e24aa}thead tr.grp th.c0{color:var(--dim)}
td.co,th.co{text-align:left;position:sticky;left:0;z-index:2;background:var(--card);border-right:2px solid var(--line2)}
thead tr.sub th.co{z-index:6;background:var(--head)}thead tr.sub th.co.open{z-index:10}
td.co a{display:block;color:var(--ink);font-weight:700;text-decoration:none;overflow:hidden;text-overflow:ellipsis;line-height:1.25}td.co a:hover{text-decoration:underline}
td.co .ls{display:block;font-size:10px;color:var(--dim);line-height:1.2;overflow:hidden;text-overflow:ellipsis}td.co .ls b{color:var(--dgreen)}
td.isec,th.isec{text-align:left}td.isec{font-size:10.5px;line-height:1.25;color:var(--dim)}
td.isec i,td.isec span{display:block;font-style:normal;overflow:hidden;text-overflow:ellipsis}td.isec i{color:var(--txt)}
td.num{text-align:right;padding-right:8px}td.txt{text-align:left}
td.b{background:#dfeaf6}td.g{background:var(--gbg)}td.a{background:var(--abg)}td.r{background:var(--rbg)}td.n{color:var(--faint)}
td small{display:block;font-size:9.5px;color:var(--dim);line-height:1.15;overflow:hidden;text-overflow:ellipsis}
td.pl{padding:0 2px}
.pill{display:inline-block;border-radius:10px;padding:2px 6px;font-size:10.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.p0{background:#e0ddd0;color:#8a8676;font-weight:600}.p1{background:#fbe9a9;color:#6b5300}.p2{background:#f8cf9c;color:#7a3500}.p3{background:#1b5e20;color:#fff}
.rp-Probable{background:#1b5e20;color:#fff}.rp-Plausible{background:#c5e3c6;color:#1b5e20}.rp-Possible{background:#fbe9a9;color:#6b5300}.rp-None{background:#e0ddd0;color:#8a8676;font-weight:600}
.rn-Probable{background:#b71c1c;color:#fff}.rn-Plausible{background:#f4c7c5;color:#8e1b1b}.rn-Possible{background:#fbe9a9;color:#6b5300}.rn-None{background:#e0ddd0;color:#8a8676;font-weight:600}
.msp{position:absolute;z-index:30;top:100%;left:0;margin-top:2px;background:#fff;border:1px solid var(--line2);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.16);padding:6px 4px;max-height:330px;overflow:auto;min-width:210px;max-width:440px;text-align:left;font-weight:400;font-size:12px;color:var(--txt);cursor:default;white-space:nowrap}
.msp.rgt{left:auto;right:0}
.mst{display:flex;justify-content:space-between;gap:16px;padding:2px 8px 4px;font-size:10.5px;font-weight:700;color:var(--dim);border-bottom:1px solid #eeeadc;margin:0 0 3px}
.mst a{color:var(--blue);cursor:pointer;font-weight:400}.mst+.mso{margin-top:0}
.mso{display:block;padding:3px 8px;cursor:pointer;border-radius:3px;overflow:hidden;text-overflow:ellipsis}.mso.off{color:var(--faint);cursor:default}.mso:hover{background:#f3efe2}.mso input{margin:0 6px 0 0;vertical-align:-2px}
.note{flex:none;font-size:11px;color:var(--dim);margin:6px 0 0}.empty{padding:28px;text-align:center;color:var(--faint);height:auto}
a.mcl{color:var(--blue)}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.hd .sum{display:none}}
thead tr.grp th.co{position:sticky;left:0;z-index:6;background:var(--band);border-right:2px solid var(--line2)}

var DATA={"asof":"2026-11-17","built":"2026-11-17T22:45:39","version":"3.2-2026-11-17","rules":"Position Entry and Exit Rules, version of 13-Nov-2026","daily_version":"1.7-2026-11-17","pages":[{"id":"hc","name":"Healthy Confirmation?","k":null,"slug":"healthy-confirmation"},{"id":"proven","name":"Reinforcing / Proven S2 Core Investment?","k":"proven","slug":"reinforcing-proven-s2-core-investment"},{"id":"early","name":"Broadening / Early S2 Core Investment?","k":"early","slug":"broadening-early-s2-core-investment"},{"id":"inflecting","name":"Inflecting / S1→S2 Probing Bet?","k":"inflecting","slug":"inflecting-s1-to-s2-probing-bet"},{"id":"s1","name":"Bottoming / S1 Speculative Bet?","k":"s1","slug":"bottoming-s1-speculative-bet"},{"id":"s3","name":"Restarting Reinforcing / S3 Speculative Bet?","k":"s3","slug":"restarting-reinforcing-s3-speculative-bet"},{"id":"s4","name":"Collapsing / S4 Speculative Bet?","k":"s4","slug":"collapsing-s4-speculative-bet"}],"about":{"proven":["What this page lists: every stock the signed rules classify today, as new capital, as Reinforcing / Proven S2 Core Investment: Stage 2 (advancing) rated Probable or Plausible, with at least one completed pullback or base since Stage 2 (advancing) began.","Two routes to a first tranche or an add. Add on Healthy Retest: Pulling Back? (Early Stage Indicator), then a 2nd or later Retest of a rising moving average on low volume (Late Stage Indicator), then a trigger day closing above that moving average. Add on VCP + Breakout: Basing / Based? (Early Stage Indicator), then all four VCP tests (Late Stage Indicator), then a trigger day closing above the six-month high.","Before tranche 1: Market Cycle Phase Uptrend, and the stock in the Pool of Middle Innings Eligible Stocks (the four Middle Innings tests are the last columns).","A trigger day: the share price up 1.5% or more on the day, volume 1.20 times its 50-day average or more, and the close in the top quarter of the day's range. It counts only on or after the first day of the Late Stage Indicator.","How to read the table: every heading sorts the table. Green = the test is met; amber = partly met or close; red = the wrong side of the test. Depth of a fall from the six-month high: Shallow Pullback 10% to 15%, Medium Pullback 15% to 20%, Deep Pullback over 20%. A negative number is shown in brackets: (9.1)% is a fall of 9.1%. A date reads \"Fri 13-Nov (4D)\": the day, then how many days ago it was. The order to begin with: the stocks furthest along first (trigger day, then Late Stage Indicator, then Early Stage Indicator). The table is scaled to the width of the window, so that it does not scroll sideways."],"early":["What this page lists: every stock the signed rules classify today, as new capital, as Broadening / Early S2 Core Investment: Stage 2 (advancing) rated Probable or Plausible, with no completed pullback or base yet since Stage 2 (advancing) began (it is in its first, or has not had one).","One route. Add on Healthy Retest: Pulling Back? (Early Stage Indicator), then a 1st Retest of a rising moving average on low volume (Late Stage Indicator), then a trigger day closing above that moving average. The Retest columns show which moving average is being retested, how far the price is from it, how long the Retest has run and its volume.","Before tranche 1: Market Cycle Phase Uptrend. The four VCP tests are shown for information: a VCP breakout is not an entry route for this classification in the signed rules.","A trigger day: the share price up 1.5% or more on the day, volume 1.20 times its 50-day average or more, and the close in the top quarter of the day's range. It counts only on or after the first day of the Late Stage Indicator.","How to read the table: every heading sorts the table. Green = the test is met; amber = partly met or close; red = the wrong side of the test. Depth of a fall from the six-month high: Shallow Pullback 10% to 15%, Medium Pullback 15% to 20%, Deep Pullback over 20%. A negative number is shown in brackets: (9.1)% is a fall of 9.1%. A date reads \"Fri 13-Nov (4D)\": the day, then how many days ago it was. The order to begin with: the stocks furthest along first (trigger day, then Late Stage Indicator, then Early Stage Indicator). The table is scaled to the width of the window, so that it does not scroll sideways."],"inflecting":["What this page lists: every stock the signed rules classify today, as new capital, as Inflecting / S1→S2 Probing Bet: turning from Stage 1 (bottoming) to Stage 2 (advancing). A stock is here when its 150-day moving average crossed above its 200-day, or its 200-day turned up, in the last week, or when either is expected within the next month at the last 10 sessions' rate.","Four separate routes. ONE route is enough: each route has its own Early Stage Indicator and Late Stage Indicator, and a stock's furthest step (the tiles) is the furthest it has reached on any one route. The cross and the turn-up are not both needed. The route a trigger day counts on is named under its date.","Route 1, the 150-day crossing above the 200-day. Early Stage Indicator, Crossing Soon?: the cross is expected within 21 sessions at the last 10 sessions' rate. Late Stage Indicator, Crossed?: it crossed in the last week, with up-day volume over the last 5 sessions at 1.20 times the 50-day average or more.","Route 2, the 200-day turning up. Early Stage Indicator, Turning Up Soon?: the 200-day is expected to stand higher than 21 sessions earlier within 21 sessions. Late Stage Indicator, Turned Up?: it did so in the last week, with the same up-day volume.","Routes 3 and 4, the 5-day and the 10-day turning up. Early Stage Indicator, Flattening?: the line fell over the last week and its fall has slowed by two-thirds or stopped. Late Stage Indicator, Turned Up?: the line rose on each of the last two sessions, having fallen earlier in the week, and has not fallen since.","A trigger day: the share price up 1.5% or more on the day, volume 1.20 times its 50-day average or more, and the close in the top quarter of the day's range. It counts only on or after the first day of the Late Stage Indicator.","How to read the table: every heading sorts the table. Green = the test is met; amber = partly met or close; red = the wrong side of the test. Depth of a fall from the six-month high: Shallow Pullback 10% to 15%, Medium Pullback 15% to 20%, Deep Pullback over 20%. A negative number is shown in brackets: (9.1)% is a fall of 9.1%. A date reads \"Fri 13-Nov (4D)\": the day, then how many days ago it was. The order to begin with: the stocks furthest along first (trigger day, then Late Stage Indicator, then Early Stage Indicator). The table is scaled to the width of the window, so that it does not scroll sideways."],"s1":["What this page lists: every stock the signed rules classify today, as new capital, as Bottoming / S1 Speculative Bet: Stage 1 (bottoming) rated Plausible or Probable, and not already classified as a Core Investment or as Inflecting.","The route is the 5-day or the 10-day moving average turning up. Early Stage Indicator, Flattening? (from falling): the line fell over the last week and its fall has slowed by two-thirds or stopped. Late Stage Indicator, Turned up?: the line rose on each of the last two sessions, having fallen earlier in the week.","A trigger day: the share price up 1.5% or more on the day, volume 1.20 times its 50-day average or more, and the close in the top quarter of the day's range. It counts only on or after the first day of the Late Stage Indicator.","How to read the table: every heading sorts the table. Green = the test is met; amber = partly met or close; red = the wrong side of the test. Depth of a fall from the six-month high: Shallow Pullback 10% to 15%, Medium Pullback 15% to 20%, Deep Pullback over 20%. A negative number is shown in brackets: (9.1)% is a fall of 9.1%. A date reads \"Fri 13-Nov (4D)\": the day, then how many days ago it was. The order to begin with: the stocks furthest along first (trigger day, then Late Stage Indicator, then Early Stage Indicator). The table is scaled to the width of the window, so that it does not scroll sideways."],"s3":["What this page lists: every stock the signed rules classify today, as new capital, as Restarting Reinforcing / S3 Speculative Bet: Stage 3 (topping) rated Possible, Plausible or Probable (its 200-day moving average is still higher than 21 sessions ago, but the uptrend is tiring), and not rated Stage 2 (advancing) Plausible or Probable. A former Stage 2 (advancing) stock that may restart its advance.","The route is the 5-day or the 10-day moving average turning up. Early Stage Indicator, Flattening? (from falling): the line fell over the last week and its fall has slowed by two-thirds or stopped. Late Stage Indicator, Turned up?: the line rose on each of the last two sessions, having fallen earlier in the week.","A trigger day: the share price up 1.5% or more on the day, volume 1.20 times its 50-day average or more, and the close in the top quarter of the day's range. It counts only on or after the first day of the Late Stage Indicator.","How to read the table: every heading sorts the table. Green = the test is met; amber = partly met or close; red = the wrong side of the test. Depth of a fall from the six-month high: Shallow Pullback 10% to 15%, Medium Pullback 15% to 20%, Deep Pullback over 20%. A negative number is shown in brackets: (9.1)% is a fall of 9.1%. A date reads \"Fri 13-Nov (4D)\": the day, then how many days ago it was. The order to begin with: the stocks furthest along first (trigger day, then Late Stage Indicator, then Early Stage Indicator). The table is scaled to the width of the window, so that it does not scroll sideways."],"s4":["What this page lists: every stock the signed rules classify today, as new capital, as Collapsing / S4 Speculative Bet: Stage 4 (declining) rated Plausible or Probable (the price is below a 200-day moving average that is lower than 21 sessions ago).","The route is the 5-day or the 10-day moving average turning up. Early Stage Indicator, Flattening? (from falling): the line fell over the last week and its fall has slowed by two-thirds or stopped. Late Stage Indicator, Turned up?: the line rose on each of the last two sessions, having fallen earlier in the week.","A trigger day: the share price up 1.5% or more on the day, volume 1.20 times its 50-day average or more, and the close in the top quarter of the day's range. It counts only on or after the first day of the Late Stage Indicator.","How to read the table: every heading sorts the table. Green = the test is met; amber = partly met or close; red = the wrong side of the test. Depth of a fall from the six-month high: Shallow Pullback 10% to 15%, Medium Pullback 15% to 20%, Deep Pullback over 20%. A negative number is shown in brackets: (9.1)% is a fall of 9.1%. A date reads \"Fri 13-Nov (4D)\": the day, then how many days ago it was. The order to begin with: the stocks furthest along first (trigger day, then Late Stage Indicator, then Early Stage Indicator). The table is scaled to the width of the window, so that it does not scroll sideways."],"hc":["What this page lists: first, the capital you have added, every tranche in the Position Management System bought in the last 12 sessions; second, every trigger day of the last six sessions on a stock you follow, where no capital has been added.","The healthy confirmation days (rules section 6), counted from day 1 (the purchase or the trigger day). Day 2 and day 3 are each healthy when the stock is up at least 1.5% more than the market, on volume 1.20 times its 50-day average or more, closing in the top quarter of the day's range. Day 6 is healthy when the stock is at least 5% ahead of the market since day 1, on 1.20 times average volume, with every close in the top quarter. The market is the equal-weighted index of European companies of EUR 500m or more.","Information only: only the stop-losses sell.","H  var sc=cols.filter(function(c){return c.id===st.sort;})[0];
 if(sc)rows.sort(function(a,b){var x=sc.v(a),y=sc.v(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;var c=x<y?-1:x>y?1:0;return st.asc?c:-c;});
 var g=[],last=null,W=0,own=(cols[0].cls==='co');
 cols.forEach(function(c,i){c._gs=(i>0&&(c.g!==cols[i-1].g||c.gs))?1:0;c._w=wOf(c);W+=c._w;if(last&&last.g===c.g&&!c._gs&&!(own&&i===1))last.n++;else{last={g:c.g,n:1,gc:c.gc};g.push(last);}});
 var h='<div class="tw"><table style="width:'+W+'px"><colgroup>'+cols.map(function(c){return '<col style="width:'+c._w+'px">';}).join('')+'</colgroup><thead><tr class="grp">'
  +g.map(function(x,i){return '<th colspan="'+x.n+'" class="'+(x.gc||gcl(x.g))+(i===0&&own?' co':'')+(i>1||(i===1&&!own)?' gs':'')+'" title="'+esc(x.g)+'">'+esc(x.g)+'</th>';}).join('')+'</tr><tr class="sub">'
  +cols.map(function(c,i){return thCell(c,i,cols.length,optRows||[],tix);}).join('')+'</tr></thead><tbody>';
 if(!rows.length)h+='<tr><td colspan="'+cols.length+'" class="empty">'+empty+'</td></tr>';
 rows.forEach(function(r){h+='<tr>'+cols.map(function(c){var x=c.c(r);return '<td class="'+(c.cls||'')+' '+x.k+(c._gs?' gs':'')+'"'+(x.t?' title="'+esc(x.t)+'"':'')+'>'+x.h+'</td>';}).join('')+'</tr>';});
 return h+'</tbody></table></div>';}
function mcl(ts,title){ts=ts.filter(function(t,i){return t&&ts.indexOf(t)===i;});if(!ts.length)return '';return ' <a class="mcl" target="_blank" rel="noopener" href="https://vfhqi.github.io/master/multichart/?list='+encodeURIComponent(ts.join(',')).replace(/%2C/g,',')+'&title='+encodeURIComponent(title)+'">Open these '+ts.length+' in the Multi-stock Dashboard</a>';}

function classPage(){
 var all=DATA.rows.filter(function(r){return r.k===K;}),routes=[];
 all.forEach(function(r){r.r.forEach(function(x){if(routes.indexOf(x.id)<0)routes.push(x.id);});});

 var core=(K==='proven'||K==='early'),cols=baseCols().concat(stageCols());

 showR.forEach(function(id){var rc=(id==='Add on Healthy Retest'?retestCols(id):id==='Add on VCP + Breakout'?vcpCols(true):id.indexOf('turn-up')>0&&id.indexOf('200D')<0?turnCols(id):crossCols(id)),ix=routes.indexOf(id),
  gn=(routes.length>1?'Route '+(ix+1)+' of '+routes.length+': ':'The route: ')+(RN[id]||id);rc.forEach(function(c){c.g=gn;c.gc=RC[ix%RC.length];});cols=cols.concat(rc);});
 cols=cols.concat(tailCols(ids,routes));
 if(K==='early')cols=cols.concat(vcpCols(false));
 if(K==='proven')cols=cols.concat(poolCols());
 COLF={};cols.forEach(function(c){if(c.f)COLF[c.id]=c;});
 var base=all.filter(function(r){return passF(r)&&passH(r);}),cnt=[0,0,0,0],cfN=0;base.forEach(function(r){cnt[stepOf(r)]++;if(r.cf)cfN++;});
 var rows=base.filter(function(r){return (st.step<0||stepOf(r)===st.step)&&(!st.cf||r.cf);});
 if(!st.sort){st.sort='step';st.asc=false;}
 if(st.sort==='step'){var sk=function(r){var t=trig(r,ids);return stepOf(r)*1e6+(t?1e5-ago(t.tg[0]):0);};rows.sort(function(a,b){return sk(b)-sk(a)||(a.n<b.n?-1:1);});}
 var TL=(DATA.tiles||{})[K]||{},TS=(DATA.tshort||{})[K]||{};
 var h=head()+tiles(cnt,cfN,TL,TS)+bar('Showing <b>'+rows.length+'</b> of '+all.length+' stocks',rows.map(function(r){return r.t;}),'Investment Classification: '+PAGE.name.replace(/\?$/,''),routes);
 h+=table(cols,rows,'No stock here with these choices.',all,'');
 app.className='';app.innerHTML=h;wire();}

function hcCols(buy){var KN={};DATA.pages.forEach(function(p){if(p.k)KN[p.k]=p.name.replace(/\?$/,'');});
 function day(k,lab){var G=lab,f=function(o){var x=o.cf[k];return x&&x!=='to come'?x:null;},tc=C('to come','n');return [
  {g:G,id:k+'m',h:'Against the market',t:lab+': the stock\'s move less the market\'s. Healthy needs +1.5% or more',v:function(o){var x=f(o);return x?x.rel_up:null;},c:function(o){var x=f(o);return !x?tc:C(pc(x.rel_up),x.rel_up>=0.015?'g':'r');}},
  {g:G,id:k+'v',h:'Volume',t:lab+': volume against the 50-day average. Healthy needs 1.20 times or more',v:function(o){var x=f(o);return x?x.vol_x:null;},c:function(o){var x=f(o);return !x?tc:C(mult(x.vol_x),x.vol_x>=1.2?'g':'r');}},
  {g:G,id:k+'c',h:'Close in day\'s range',t:lab+': where the close sat in the day\'s range. Healthy needs 75% or more',v:function(o){var x=f(o);return x?x.close_in_range:null;},c:function(o){var x=f(o);return !x?tc:x.close_in_range==null?DASH:C(Math.round(x.close_in_range*100)+'%',x.close_in_range>=0.75?'g':'r');}}];}
 var f6=function(o){var x=o.cf.day6;return x&&x!=='to come'?x:null;},tc=C('to come','n');
 var c=baseCols().map(function(b){return {g:b.g,id:'o_'+b.id,h:b.h,cls:b.cls,t:b.t,fk:(buy&&b.fk==='pop')?null:b.fk,v:function(o){return b.v(o.r);},c:function(o){return b.c(o.r);}};});
 c.push({g:'',id:'what',h:buy?'Tranche bought':'Route of the trigger day',cls:'txt',t:'',v:function(o){return o.what;},c:function(o){return C(esc(o.what)+(buy&&o.size!=null?'<small>'+(+o.size).toFixed(2)+'% of AUM now</small>':''));}},
  {g:'',id:'d1',h:'Day 1',t:buy?'The purchase date':'The trigger day',v:function(o){return -ago(o.date);},c:function(o){return C(fd(o.date));}},
  {g:'',id:'cls',h:buy?'Classification held under':'Classification as new capital today',cls:'txt',t:'',v:function(o){return o.cls;},c:function(o){return C(esc(o.cls||''));}});
 c=c.concat(day('day2','Day 2'),day('day3','Day 3'));
 c.push({g:'Day 6',id:'d6m',h:'Against the market since day 1',t:'Healthy needs +5% or more',v:function(o){var x=f6(o);return x?x.rel_since:null;},c:function(o){var x=f6(o);return !x?tc:C(pc(x.rel_since),x.rel_since>=0.05?'g':'r');}},
  {g:'Day 6',id:'d6v',h:'Volume',t:'Average volume since day 1 against the 50-day average. Healthy needs 1.20 times or more',v:function(o){var x=f6(o);return x?x.vol_x:null;},c:function(o){var x=f6(o);return !x?tc:C(mult(x.vol_x),x.vol_x>=1.2?'g':'r');}},
  {g:'Day 6',id:'d6c',h:'Every close in the top quarter',t:'Every close since day 1 in the top quarter of its day\'s range',v:function(o){var x=f6(o);return x?(x.all_top_quarter?1:0):null;},c:function(o){var x=f6(o);return !x?tc:x.all_top_quarter?C('Yes','g'):C('No','r');}},
  {g:'',id:'hs',h:'Healthy days so far',gs:1,t:'Of the confirmation days that have happened, how many were healthy',v:function(o){return o.done?o.ok/o.done:-1;},c:function(o){return C('<span class="pill '+(!o.done?'p0':o.ok===o.done?'p3':o.ok?'p1':'p2')+'">'+(!o.done?'day 2 to come':o.ok+' of '+o.done)+'</span>');}});
 return c;}

 if(!st.sort){st.sort='d1';st.asc=false;}
 var h=head()+bar('<b>'+bu.length+'</b> purchases; <b>'+tr.length+'</b> of '+trig.length+' trigger days',bu.concat(tr).map(function(o){return o.r.t;}),'Healthy Confirmation?',null);
 h+='<h2>1. Capital you have added: tranches bought in the last 12 sessions</h2>'+table(hcCols(true),bu,'No tranche bought in the last 12 sessions.',buys.map(function(o){return o.r;}),'1:');

 h+='<p class="note">The list filter in the Company heading applies to the second table; it starts on Live, RB Interest Lists A and B, the Ideas Bench, Shortlist and Longlist and the Pool. Clear it to see every trigger day.</p>';
 app.className='hcp';app.innerHTML=h;wire();}
