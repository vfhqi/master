function fd(s){if(!s)return '';var d=D(s);return d.getUTCDate()+'-'+MON[d.getUTCMonth()];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pc(v,dp){if(v==null)return 'n/a';var x=(v*100).toFixed(dp==null?1:dp);return (v>0?'+':'')+x+'%';}
var STEPN=['no step yet','Early indicator','Late indicator','Trigger day'];
var PSD='https://vfhqi.github.io/ratings/pms/holding.html?t=';
function link(r){return '<a href="'+PSD+encodeURIComponent(r.t)+'" target="_blank" rel="noopener" title="Open the Per-stock Dashboard">'+esc(r.n)+'</a>';}
function badges(L){return (L||[]).map(function(c){return '<span class="bdg '+c+'" title="'+esc((DATA.lists.filter(function(x){return x[0]===c;})[0]||[])[1])+'">'+(c==='L'?'Live':c==='KD'?'KD':c)+'</span>';}).join('');}
function rat(s){var n=['S1','S2','S3','S4'];return '<span class="rat2">'+n.map(function(k,i){return '<span class="rat r-'+s[i]+'" title="Stage '+(i+1)+': '+s[i]+'">'+k+' '+(s[i]==='None'?'&ndash;':s[i][0]+s[i].slice(1,4))+'</span>';}).join('')+'</span>';}
function cfCell(cf){if(!cf)return '<span class="mut">&ndash;</span>';
  function d23(x,k){if(x==='to come'||x==null)return '<span class="tc">'+k+' to come</span>';return '<span class="'+(x.healthy?'ok':'bad')+'" title="'+k+': '+pc(x.rel_up)+' against the market, '+(x.vol_x==null?'n/a':x.vol_x+'x')+' the 50-day average volume, close '+(x.close_in_range==null?'n/a':Math.round(x.close_in_range*100)+'%')+' up the day\'s range">'+k+(x.healthy?' ✓':' ✗')+'</span>';}
  var d6=cf.day6,s6=(d6==='to come'||d6==null)?'<span class="tc">day 6 to come</span>':'<span class="'+(d6.healthy?'ok':'bad')+'" title="Day 6: '+pc(d6.rel_since)+' against the market since the trigger day, '+(d6.vol_x==null?'n/a':d6.vol_x+'x')+' average volume, '+(d6.all_top_quarter?'every':'not every')+' close in the top quarter of its range">day 6'+(d6.healthy?' ✓':' ✗')+'</span>';
  return '<span class="cf">'+d23(cf.day2,'day 2')+'<br>'+d23(cf.day3,'day 3')+'<br>'+s6+'</span>';}
var app=document.getElementById('app');
var st={step:-1,route:'all',pop:'all',sec:'',ind:'',q:'',sort:'step',asc:false};
if(PG==='hc')st.pop='ILMI';
function inPop(r){if(st.pop==='all')return true;if(st.pop==='ILMI')return (r.L||[]).some(function(c){return c!=='C'&&c!=='KD';});if(st.pop==='AB')return (r.L||[]).indexOf('A')>=0||(r.L||[]).indexOf('B')>=0;return (r.L||[]).indexOf(st.pop)>=0;}
function popSel(){var o=[['all','All stocks'],['ILMI','Live, RB Interest Lists A and B, Middle Innings stocks'],['AB','RB Interest Lists A and B']].concat(DATA.lists);
  return '<label>Stocks</label><select id="f-pop">'+o.map(function(x){return '<option value="'+x[0]+'"'+(st.pop===x[0]?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select>';}
function secSel(rows){var s={},i={};rows.forEach(function(r){s[r.sec]=1;if(!st.sec||r.sec===st.sec)i[r.ind]=1;});
  return '<label>Industry</label><select id="f-ind"><option value="">All industries</option>'+Object.keys(i).sort().map(function(x){return '<option'+(st.ind===x?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>'
   +'<label>Sector</label><select id="f-sec"><option value="">All sectors</option>'+Object.keys(s).sort().filter(function(x){return !st.ind||rows.some(function(r){return r.sec===x&&r.ind===st.ind;});}).map(function(x){return '<option'+(st.sec===x?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>';}
function head(){return '<h1>'+esc(PAGE[1])+'</h1>';}
function meta(){return '<div class="meta">On the '+fd(DATA.asof)+'-'+D(DATA.asof).getUTCFullYear()+' close; '+esc(DATA.rules||'')+'; built '+esc(DATA.built.replace('T',' ').slice(0,16))+' from the daily classification file (scripts/position_rules.py). A stock\'s name opens its Per-stock Dashboard. Badges: Live, RB Interest List A, B or C, Be/Sh/Lo the Ideas Bench, Shortlist and Longlist, Po the Pool, KD the Key Drivers stocks.</div>';}
function wire(){['f-pop','f-sec','f-ind','f-route'].forEach(function(id){var e=document.getElementById(id);if(e)e.onchange=function(){var v=e.value;if(id==='f-pop')st.pop=v;if(id==='f-sec')st.sec=v;if(id==='f-ind'){st.ind=v;st.sec='';}if(id==='f-route')st.route=v;render();};});
  var q=document.getElementById('f-q');if(q){q.oninput=function(){st.q=q.value.toLowerCase();var p=q.selectionStart;render();var q2=document.getElementById('f-q');q2.focus();q2.setSelectionRange(p,p);};}
  Array.prototype.forEach.call(document.querySelectorAll('.tile[data-step]'),function(t){t.onclick=function(){var s=+t.getAttribute('data-step');st.step=(st.step===s?-1:s);render();};});
  Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(th){th.onclick=function(){var k=th.getAttribute('data-sort');if(st.sort===k)st.asc=!st.asc;else{st.sort=k;st.asc=(k==='n'||k==='sec');}render();};});}
function sortRows(rows,val){rows.sort(function(a,b){var x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;var c=x<y?-1:x>y?1:0;return st.asc?c:-c;});return rows;}
/* ---------------- a classification page ---------------- */
function classPage(){
  var K=PAGE[2],all=DATA.rows.filter(function(r){return r.k===K;}),routes=[];
  all.forEach(function(r){r.r.forEach(function(x){if(!routes.some(function(y){return y[0]===x[0];}))routes.push([x[0],x[6],x[7]]);});});
  var base=all.filter(inPop).filter(function(r){return (!st.sec||r.sec===st.sec)&&(!st.ind||r.ind===st.ind)&&(!st.q||(r.n+' '+r.t).toLowerCase().indexOf(st.q)>=0);});
  var stepOf=function(r){if(st.route==='all')return r.st;var x=r.r.filter(function(y){return y[0]===st.route;})[0];return !x?0:x[4]?3:x[2]?2:x[1]?1:0;};
  var cnt=[0,0,0,0],cfN=0;base.forEach(function(r){cnt[stepOf(r)]++;if(r.cf)cfN++;});
  var rows=base.filter(function(r){return st.step<0||stepOf(r)===st.step;});
  var trigD=function(r){var d=null;r.r.forEach(function(x){if(x[4]&&(!d||x[4]>d))d=x[4];});return d;};
  var SV={step:function(r){return stepOf(r)*1e9+(trigD(r)?+trigD(r).replace(/-/g,''):0);},n:function(r){return r.n.toLowerCase();},sec:function(r){return r.ind+' '+r.sec;},s2:function(r){return r.s2p;},pb:function(r){return r.pb;}};
  sortRows(rows,SV[st.sort]||SV.step);
  var h=head()+'<p class="about">'+esc(DATA.about[K]||'')+'</p>'+meta();
  h+='<div class="tiles">'+[3,2,1,0].map(function(s){return '<div class="tile'+(st.step===s?' on':'')+'" data-step="'+s+'" title="Show only the stocks whose furthest step'+(st.route==='all'?'':' on this route')+' is this; click again for all"><b>'+cnt[s]+'</b><span>'+(s===0?'Classified, no step yet':'Furthest step: '+STEPN[s])+'</span></div>';}).join('')
    +'<div class="tile" style="cursor:default" title="A trigger day in the last six sessions, with its healthy confirmation days"><b>'+cfN+'</b><span>In healthy confirmation</span></div></div>';
  h+='<div class="ctl">'+popSel()+secSel(all)+(routes.length>1?'<label>Route</label><select id="f-route"><option value="all">All routes</option>'+routes.map(function(x){return '<option value="'+esc(x[0])+'"'+(st.route===x[0]?' selected':'')+'>'+esc(x[0])+'</option>';}).join('')+'</select>':'')
    +'<label>Find</label><input id="f-q" value="'+esc(st.q)+'" placeholder="name or ticker" size="14"><span class="n">'+rows.length+' of '+all.length+' stocks</span></div>';
  var showR=routes.filter(function(x){return st.route==='all'||x[0]===st.route;}),core=(K==='proven'||K==='early'),CMP=showR.length>2;   /* four routes: one cell per route */
  h+='<table><thead><tr class="grp"><th colspan="'+(core?5:4)+'"></th>'+showR.map(function(x){return '<th class="rg" colspan="'+(CMP?1:3)+'">'+esc(x[0])+'</th>';}).join('')+'<th class="rg" colspan="2"></th></tr><tr>'
    +'</tr><tr class="sub"><th data-sort="n">Company &middot; lists</th><th data-sort="sec">Industry &middot; Sector</th><th class="num">Close</th><th data-sort="s2">Stage ratings</th>'+(core?'<th data-sort="pb" title="The pullback or base the stock is in now, counted since Stage 2 (advancing) began (rules section 3)">Pullback no.</th>':'')
    +showR.map(function(x){if(CMP)return '<th class="rg rt" style="max-width:none" title="'+esc(x[1])+' &rarr; '+esc(x[2])+' &rarr; trigger day">Early &middot; late &middot; trigger<br><span class="mut">'+esc(x[1])+' &rarr; '+esc(x[2])+'</span></th>';return '<th class="rg rt" title="Early indicator">'+esc(x[1])+'</th><th class="rt" title="Late indicator">'+esc(x[2])+'</th><th class="rt" title="Up 1.5% or more, volume 1.20 times the 50-day average or more, close in the top quarter of the day\'s range, on or after the late indicator\'s first day">Trigger day</th>';}).join('')
    +'<th class="rg" data-sort="step">Furthest step</th><th>Healthy confirmation</th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="30" class="empty">No stock here with these choices.</td></tr>';
  rows.forEach(function(r){
    h+='<tr><td class="co"><b>'+link(r)+'</b> <span class="mut">'+esc(r.t)+'</span><br>'+badges(r.L)+'</td><td class="isec"><span class="mut">'+esc(r.ind)+'</span><br>'+esc(r.sec)+'</td><td class="num">'+(r.c==null?'':r.c)+'</td><td>'+rat(r.s)+'</td>'
      +(core?'<td class="num">'+(r.pb==null?'<span class="mut">&ndash;</span>':r.pb)+'</td>':'');
    showR.forEach(function(x){var y=r.r.filter(function(z){return z[0]===x[0];})[0];
      if(!y){h+=CMP?'<td class="rg mut">&ndash;</td>':'<td class="rg mut">&ndash;</td><td class="mut">&ndash;</td><td class="mut">&ndash;</td>';return;}
      var eta='';if(y[0]==='200/150D cross'&&r.eta[0]!=null)eta=' <span class="mut" title="Sessions to the cross at the last 10 sessions\' rate">('+Math.round(r.eta[0])+' sessions)</span>';
      if(y[0]==='200D turn-up'&&r.eta[1]!=null)eta=' <span class="mut" title="Sessions to the turn at the last 10 sessions\' rate">('+Math.round(r.eta[1])+' sessions)</span>';
      if(CMP){h+='<td class="rg rt">'+(y[1]?'<span class="y" title="'+esc(y[6])+'">E ✓</span>':'<span class="no">E &ndash;</span>')+eta+' &nbsp;'+(y[2]?'<span class="y" title="'+esc(y[7])+'">L ✓</span>'+(y[3]?' <span class="mut">'+fd(y[3])+'</span>':''):'<span class="no">L &ndash;</span>')+' &nbsp;'+(y[4]?'<span class="tg" title="Trigger day: '+pc(y[5][0])+', '+y[5][1]+'x the 50-day average volume, close '+Math.round(y[5][2]*100)+'% up the day\'s range">T '+fd(y[4])+'</span>':'<span class="no">T &ndash;</span>')+'</td>';return;}
      h+='<td class="rg rt">'+(y[1]?'<span class="y">✓</span>':'<span class="no">&ndash;</span>')+eta+'</td><td class="rt">'+(y[2]?'<span class="y">✓</span>'+(y[3]?' <span class="mut">since '+fd(y[3])+'</span>':''):'<span class="no">&ndash;</span>')+'</td>'
        +'<td class="rt">'+(y[4]?'<span class="tg" title="'+pc(y[5][0])+', '+y[5][1]+'x the 50-day average volume, close '+Math.round(y[5][2]*100)+'% up the day\'s range">'+fd(y[4])+'</span>':'<span class="no">&ndash;</span>')+'</td>';});
    var s=stepOf(r);h+='<td class="rg"><span class="pill p'+s+'">'+STEPN[s]+'</span></td><td>'+cfCell(r.cf)+'</td></tr>';});
  h+='</tbody></table><p class="note">The classification is the stock\'s as new capital today (rules sections 2 and 3); a holding keeps the classification it was bought or promoted under until it is sold or promoted. Healthy confirmation (days 2, 3 and 6 against the market) is information: only the stop-losses sell. Named stocks are candidates to look at, never a decision to trade.</p>';
  app.innerHTML=h;wire();}
/* ---------------- the healthy confirmation page ---------------- */
function hcPage(){
  var KN={};DATA.pages.forEach(function(p){if(p[2])KN[p[2]]=p[1].replace(/\?$/,'');});
  var trig=DATA.rows.filter(function(r){return r.cf;}).map(function(r){var x=r.r.filter(function(y){return y[4]===r.cf.trigger;})[0];return {r:r,kind:'trigger',date:r.cf.trigger,cls:KN[r.k],route:x?x[0]:'',cf:r.cf};});
  var byT={};DATA.rows.forEach(function(r){byT[r.t]=r;});
  var buys=(DATA.purchases||[]).map(function(p){var r=byT[p.t]||{t:p.t,n:p.n,ind:'',sec:'',L:['L'],s:['None','None','None','None']};return {r:r,kind:'purchase',date:p.date,cls:p.held?KN[p.held]:'',route:'Tranche '+p.tranche+' bought',cf:p.conf};});
  var all=buys.concat(trig);
  var rows=all.filter(function(o){return (o.kind==='purchase'||inPop(o.r))&&(!st.sec||o.r.sec===st.sec)&&(!st.ind||o.r.ind===st.ind)&&(!st.q||(o.r.n+' '+o.r.t).toLowerCase().indexOf(st.q)>=0);});
  var score=function(o){var c=o.cf,n=0;['day2','day3'].forEach(function(k){if(c[k]&&c[k].healthy)n++;});if(c.day6&&c.day6.healthy)n++;return n;};
  rows.sort(function(a,b){return (a.kind===b.kind?0:a.kind==='purchase'?-1:1)||(b.date<a.date?-1:b.date>a.date?1:0)||(a.r.n<b.r.n?-1:1);});
  var nB=rows.filter(function(o){return o.kind==='purchase';}).length;
  var h=head()+'<p class="about">Every purchase of the last 12 sessions in the book, and every trigger day of the last six sessions, with its healthy confirmation days (rules section 6): day 2 and day 3 each up at least 1.5% more than the market on 1.20 times the 50-day average volume or more, closing in the top quarter of the day\'s range; day 6 at least 5% ahead of the market since the trigger day, on 1.20 times average volume, every close in the top quarter. The market is the equal-weighted index of European companies of EUR 500m or more. Information only: only the stop-losses sell.</p>'+meta();
  h+='<div class="ctl">'+popSel()+secSel(all.map(function(o){return o.r;}))+'<label>Find</label><input id="f-q" value="'+esc(st.q)+'" placeholder="name or ticker" size="14"><span class="n">'+nB+' purchases; '+(rows.length-nB)+' trigger days of '+trig.length+'</span></div>';
  h+='<table><thead><tr><th>Company &middot; lists</th><th>Industry &middot; Sector</th><th>What started the count</th><th>Day 1</th><th title="A purchase: the classification it is held under. A trigger day: the stock\'s classification as new capital today.">Classification</th><th>Day 2<br><span class="mut">vs market &middot; vol &middot; close in range</span></th><th>Day 3<br><span class="mut">vs market &middot; vol &middot; close in range</span></th><th>Day 6<br><span class="mut">vs market since day 1 &middot; vol &middot; closes</span></th><th>Healthy so far</th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="9" class="empty">No purchase or trigger day here with these choices.</td></tr>';
  function dcell(x,six){if(x==null||x==='to come')return '<td class="mut">to come</td>';
    if(six)return '<td class="cf" title="'+pc(x.rel_since)+' against the market since day 1; volume '+(x.vol_x==null?'n/a':x.vol_x+' times')+' the 50-day average; '+(x.all_top_quarter?'every':'not every')+' close in the top quarter of its range"><span class="'+(x.healthy?'ok':'bad')+'">'+(x.healthy?'✓':'✗')+'</span> '+pc(x.rel_since)+' &middot; '+(x.vol_x==null?'n/a':x.vol_x+'x')+' &middot; '+(x.all_top_quarter?'all top quarter':'not all top quarter')+'</td>';
    return '<td class="cf" title="'+pc(x.rel_up)+' against the market; volume '+(x.vol_x==null?'n/a':x.vol_x+' times')+' the 50-day average; close '+(x.close_in_range==null?'n/a':Math.round(x.close_in_range*100)+'%')+' up the day\'s range"><span class="'+(x.healthy?'ok':'bad')+'">'+(x.healthy?'✓':'✗')+'</span> '+pc(x.rel_up)+' &middot; '+(x.vol_x==null?'n/a':x.vol_x+'x')+' &middot; '+(x.close_in_range==null?'n/a':Math.round(x.close_in_range*100)+'%')+'</td>';}
  rows.forEach(function(o){var c=o.cf,done=['day2','day3','day6'].filter(function(k){return c[k]&&c[k]!=='to come';}),ok=done.filter(function(k){return c[k].healthy;});
    h+='<tr><td class="co"><b>'+link(o.r)+'</b> <span class="mut">'+esc(o.r.t)+'</span><br>'+badges(o.r.L)+'</td><td class="isec"><span class="mut">'+esc(o.r.ind)+'</span><br>'+esc(o.r.sec)+'</td>'
      +'<td>'+(o.kind==='purchase'?'<b>'+esc(o.route)+'</b>':'Trigger day'+(o.route?', '+esc(o.route):''))+'</td><td>'+fd(o.date)+'</td><td>'+esc(o.cls||'')+'</td>'+dcell(c.day2)+dcell(c.day3)+dcell(c.day6,true)
      +'<td><span class="pill '+(!done.length?'p0':ok.length===done.length?'p3':ok.length?'p1':'p2')+'">'+(!done.length?'day 2 to come':ok.length+' of '+done.length+' days healthy')+'</span></td></tr>';});
  h+='</tbody></table><p class="note">A purchase is a tranche in the Position Management System bought in the last 12 sessions (its own purchase date as day 1). A trigger day is the signed one (rules section 5) on any route of the stock\'s classification today. The list of stocks defaults to the Live stocks, RB Interest Lists A and B and the Middle Innings stocks (Ideas Bench, Shortlist, Longlist, the Pool), as the workbook asks (cell A21); choose All stocks to see every trigger day.</p>';
  app.innerHTML=h;wire();}
function render(){try{if(PG==='hc')hcPage();else classPage();}catch(e){app.innerHTML='<div class="empty">This page could not be drawn: '+esc(e.message)+'</div>';if(window.console)console.error(e);}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({mdFlowHeight:document.documentElement.scrollHeight,page:PG},'*');}catch(e){}}
render();
})();
</script></body></html>
